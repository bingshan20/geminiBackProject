# Gemini 图片颜色分析器配置

# API 配置
api:
  base_url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
  timeout: 30
  max_retries: 3

# 图片处理配置
images:
  # 要处理的图片列表（支持通配符）
  files:
    - "1.png"
#    - "8.png"
#    - "9.png"
#    - "*.png"  # 匹配所有png文件

  # 图片目录（相对于src目录）
  directory: "img_en"

  # 支持的图片格式
  supported_formats: [".png", ".jpg"]

# Prompt 配置
prompts:
  # 默认使用的 prompt 名称
  default: "color_detection_speed"

  # 可用的 prompt 列表
  available:
    color_detection_speed:
      name: "颜色检测-速度"
      text: "Please quickly say the color of the word; it's okay to make mistakes. Only return one word, and do not return anything else."
      temperature: 0.05 # 温度高，则有更高的多样性，但速度会慢
      top_p: 0.8  # 数值大，则考虑更多候选词
      top_k: 20 # 考虑更多候选词
      max_tokens: 5 # maxToken数
      description: "检测图片中文字的颜色--强调速度"

    color_detection_accuracy:
      name: "颜色检测-准确"
      text: "Please accurately state the color of the word, return only one word, with no additional text."
      temperature: 0.4
      top_p: 0.95
      top_k: 50
      max_tokens: 5
      description: "检测图片中文字的颜色--强调准确性"

    color_detection_speed_simple:
      name: "颜色检测-速度-简单"
      text: "Ignore the word, state the color. One word."
      temperature: 0.05 # 温度高，则有更高的多样性，但速度会慢
      top_p: 0.8  # 数值大，则考虑更多候选词
      top_k: 20 # 考虑更多候选词
      max_tokens: 5 # maxToken数
      description: "检测图片中文字的颜色--强调速度"

    color_detection_accuracy_simple:
      name: "颜色检测-准确-简单"
      text: "Carefully state the color of the word, ignoring the text. One word."
      temperature: 0.4
      top_p: 0.95
      top_k: 50
      max_tokens: 5
      description: "检测图片中文字的颜色--强调准确"

# 输出配置
output:
  # 结果文件配置
  results:
    directory: "results/batch_results"
    filename: "analysis_results_{timestamp}.json"
    format: "json"  # json, csv

  # 报告配置
  reports:
    directory: "results/performance_reports"
    include_timing: true
    generate_summary: true

network:
  bandwidth_mbps: 20  #标准带宽速度，单位Mbps
  one_way_latency_ms: 4.2  # 单向网络延迟

# 性能分析配置
performance:
  enable_timing: true
  save_individual_results: true
  log_level: "INFO"
  enable_callback_timing: true  # 是否启用回调时间分析
  callback_interval_ms: 100  # 回调分析间隔（毫秒）
